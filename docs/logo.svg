<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#1A1D23"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  
  <!-- ◢◤ wordmark -->
  <g transform="translate(256,190)">
    <!-- ◢ -->
    <polygon points="-80,-45 -20,-45 -20,45" fill="#56D4DD" opacity="0.9"/>
    <!-- ◤ -->
    <polygon points="20,-45  80,-45 80,45" fill="#56D4DD" opacity="0.9"/>
    <polygon points="20,-45  20,45  80,45" fill="#56D4DD" opacity="0.55"/>
  </g>
  
  <!-- sparkline bars -->
  <g transform="translate(105,280)">
    <rect x="0"   y="-12" width="24" height="12" rx="3" fill="#3A3F47"/>
    <rect x="32"  y="-28" width="24" height="28" rx="3" fill="#3A3F47"/>
    <rect x="64"  y="-52" width="24" height="52" rx="3" fill="#A78BFA"/>
    <rect x="96"  y="-72" width="24" height="72" rx="3" fill="#A78BFA"/>
    <rect x="128" y="-60" width="24" height="60" rx="3" fill="#56D4DD"/>
    <rect x="160" y="-80" width="24" height="80" rx="3" fill="#56D4DD"/>
    <rect x="192" y="-70" width="24" height="70" rx="3" fill="#56D4DD"/>
    <rect x="224" y="-105" width="24" height="105" rx="3" fill="#56D4DD"/>
    <rect x="256" y="-80" width="24" height="80" rx="3" fill="#56D4DD"/>
  </g>
</svg>
