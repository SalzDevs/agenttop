<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#1A1D23"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  
  <!-- glow behind logo -->
  <ellipse cx="256" cy="200" rx="160" ry="50" fill="#56D4DD" opacity="0.08"/>
  
  <!-- ◢◤ wordmark -->
  <g transform="translate(256,180)" fill="#56D4DD">
    <polygon points="-80,-40 -80,40 -20,40" opacity="0.9"/>
    <polygon points="-20,-40 -20,40  40,40" opacity="0.9"/>
    <polygon points="20,-40  80,-40  80,40" opacity="0.9"/>
    <polygon points="20,-40  20,40  80,40" opacity="0.55"/>
  </g>
  
  <!-- agenttop text -->
  <text x="256" y="260" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace" font-size="32" font-weight="700" fill="#D4D8DE" letter-spacing="4">agenttop</text>
  
  <!-- sparkline bars -->
  <g transform="translate(120,310)">
    <rect x="0"   y="-25" width="20" height="25" rx="3" fill="#3A3F47"/>
    <rect x="28"  y="-45" width="20" height="45" rx="3" fill="#3A3F47"/>
    <rect x="56"  y="-70" width="20" height="70" rx="3" fill="#A78BFA"/>
    <rect x="84"  y="-85" width="20" height="85" rx="3" fill="#A78BFA"/>
    <rect x="112" y="-95" width="20" height="95" rx="3" fill="#A78BFA"/>
    <rect x="140" y="-85" width="20" height="85" rx="3" fill="#56D4DD"/>
    <rect x="168" y="-95" width="20" height="95" rx="3" fill="#56D4DD"/>
    <rect x="196" y="-90" width="20" height="90" rx="3" fill="#56D4DD"/>
    <rect x="224" y="-120" width="20" height="120" rx="3" fill="#56D4DD"/>
  </g>
  
  <!-- cost counter -->
  <text x="256" y="400" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace" font-size="22" fill="#F5B86B" font-weight="bold">$0.0103</text>
  <text x="256" y="430" text-anchor="middle" font-family="SF Mono, Menlo, Monaco, monospace" font-size="14" fill="#6B7280">in 7.4k　out 31　reqs 2</text>
</svg>
